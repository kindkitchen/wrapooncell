# The marker and the declaration of a pov-repo. `just status pov-repo` errors when it is not satisfied.
#
# No pov-repo lives below another: this is the only file of its name from here down.

# Skill-repos are mounted at `<folder>/<name>/`.
skill-repo.folder = "skills"

# The mounted skill-repos and the branch each one is subscribed to: `<name> = "<branch>"`.
[skill-repo.submodule]
wrapooncell-cli = "skill-repo/wrapooncell-cli/main"
